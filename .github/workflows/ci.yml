name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  pull-requests: write

jobs:
  ci:
    name: CI (Lint & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.11.4
          args: --timeout=5m

      - name: Run tests
        run: |
          go install gotest.tools/gotestsum@latest
          gotestsum --junitfile test-results.xml --format github-actions -- -race -count=1 -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: '!cancelled()'
        with:
          files: test-results.xml
          check_name: Test Results

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: coverage.txt
          format: golang

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage.txt

  build:
    name: Build
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable

      - name: Build all binaries
        run: |
          # Version info from git
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"

          # Build all target platforms
          platforms=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
          )

          for platform in "${platforms[@]}"; do
            IFS='/' read -r goos goarch <<< "$platform"
            output="figgo-${goos}-${goarch}"

            if [ "$goos" = "windows" ]; then
              output="${output}.exe"
            fi

            echo "Building ${output}..."
            GOOS=$goos GOARCH=$goarch go build -v -ldflags "$LDFLAGS" -o "$output" ./cmd/figgo
            ls -la "$output"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: figgo-binaries
          path: figgo-*

  verify-modules:
    name: Verify Modules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable

      - name: Verify modules
        run: |
          go mod tidy
          go mod verify
          git diff --exit-code go.mod go.sum

  benchmark:
    name: Benchmark (Informational)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true  # Don't block PR on benchmark issues
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable

      - name: Run PRD target benchmarks
        run: |
          echo "=== Running PRD Performance Benchmarks ===" | tee benchmark-results.txt
          echo "" | tee -a benchmark-results.txt
          go test -bench=BenchmarkPRDTargets -benchmem -run=^$ . 2>&1 | tee -a benchmark-results.txt
          echo "" | tee -a benchmark-results.txt
          echo "=== Running Allocation Benchmarks ===" | tee -a benchmark-results.txt
          go test -bench=BenchmarkAllocationTarget/.*FullWidth -benchmem -run=^$ -benchtime=500ms . 2>&1 | tee -a benchmark-results.txt
          echo "" | tee -a benchmark-results.txt
          echo "=== Running Throughput Benchmarks ===" | tee -a benchmark-results.txt
          go test -bench=BenchmarkThroughputTarget/MediumText -benchmem -run=^$ -benchtime=500ms . 2>&1 | tee -a benchmark-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-results
          path: benchmark-results.txt

      - name: Comment summary
        run: |
          echo "✅ Benchmarks completed successfully"
          echo "📊 Results uploaded as artifact 'benchmark-results'"
          echo "ℹ️  See benchmarks/README.md for performance targets and baselines"